name: Import Tokens

# One-click token import: paste the Figma plugin's token JSON export into the
# form field, Run, and the store + docs update the same way a component sync
# does. GitHub Actions has no file-upload input, so tokens arrive as text.
#
# Like the sync workflow, only users with WRITE access can trigger this.
# Uses the same DOCS_DISPATCH_TOKEN secret to cascade the docs rebuild.

on:
  workflow_dispatch:
    inputs:
      tokens_json:
        description: "Paste the token JSON export from the Figma plugin"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iqm-ds-sync
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Write tokens to a file
        env:
          TOKENS_JSON: ${{ inputs.tokens_json }}
        run: printf '%s' "$TOKENS_JSON" > /tmp/tokens-export.json

      - name: Import tokens into the store
        run: npm run import:tokens -- /tmp/tokens-export.json

      - name: Count imported tokens
        id: count
        run: |
          N=$(node -e "const D=require('better-sqlite3');const db=new D('src/store/db.sqlite',{readonly:true});const s=db.prepare('SELECT MAX(snapshot_id) m FROM tokens').get().m;console.log(db.prepare('SELECT COUNT(*) c FROM tokens WHERE snapshot_id=?').get(s).c);")
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "Imported $N tokens."

      - name: Commit refreshed store
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f src/store/db.sqlite
          if git diff --cached --quiet; then
            echo "No store changes to commit."
          else
            git commit -m "Automated sync: imported ${{ steps.count.outputs.n }} tokens on $(date -u +'%Y-%m-%d')"
            git push origin main
          fi

      - name: Trigger docs rebuild (cross-repo cascade)
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DOCS_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/bhaveshvasava-IQM/iqm-ds-docs/dispatches \
            -d '{"event_type":"store-updated"}'
          echo "Dispatched store-updated to iqm-ds-docs — the docs Pages deploy will run."
